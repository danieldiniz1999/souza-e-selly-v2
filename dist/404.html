<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <style>:root{--bg:#090b0e;--card-bg:#12161cd9;--gold:#d4af37;--gold-light:#f3e5ab;--gold-dark:#997b24;--text:#e5e7eb;--text-muted:#9ca3af;--border:#d4af3740}*{box-sizing:border-box;margin:0;padding:0}body{color:var(--text);text-align:center;background:radial-gradient(circle at 50% 30%,#151a22 0%,#090b0e 100%);justify-content:center;align-items:center;min-height:100vh;padding:24px;font-family:Plus Jakarta Sans,-apple-system,sans-serif;display:flex}.card{background:var(--card-bg);border:1px solid var(--border);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-radius:16px;width:100%;max-width:520px;padding:48px 36px;box-shadow:0 20px 50px #0009,0 0 30px #d4af371a}.logo{border:2px solid var(--gold);object-fit:cover;border-radius:50%;width:80px;height:80px;margin:0 auto 24px;display:block;box-shadow:0 0 20px #d4af3759}h1{color:var(--gold-light);letter-spacing:.05em;margin-bottom:12px;font-family:Cinzel,serif;font-size:2rem}p{color:var(--text-muted);margin-bottom:28px;font-size:.95rem;line-height:1.6}.btn{background:linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);color:#000;text-transform:uppercase;letter-spacing:.08em;border-radius:999px;align-items:center;gap:10px;padding:14px 28px;font-size:.9rem;font-weight:700;text-decoration:none;transition:all .25s;display:inline-flex;box-shadow:0 4px 18px #d4af3759}.btn:hover{transform:translateY(-2px);box-shadow:0 8px 25px #d4af3780}.hint{color:var(--gold);opacity:.8;margin-top:18px;font-size:.8rem}</style>
</head>
<body>
  <div class="card">

    <h1>SOUZA &amp; SELLY</h1>
    <p>A página solicitada não foi encontrada ou foi movida. Você será redirecionado para a página inicial em instantes.</p>
    <a href="/" class="btn">Retornar ao Início</a>
    <div class="hint">Redirecionando automaticamente em 3 segundos...</div>
  </div>
</body>
</html>
